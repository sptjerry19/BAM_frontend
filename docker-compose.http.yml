# Local without SSL:
#   docker compose -f docker-compose.http.yml up -d --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        NGINX_CONF: nginx.http.conf
    ports:
      - "${WEB_PORT:-80}:80"
    volumes: []
    restart: unless-stopped
    networks:
      - jb_net

networks:
  jb_net:
    external: true
    name: jb_net
