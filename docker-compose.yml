services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Same-origin: browser calls /api on port 80, nginx proxies to backend
        VITE_API_URL: /api
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on: []
    restart: unless-stopped
    networks:
      - jb_net

networks:
  jb_net:
    external: true
    name: jb_net
