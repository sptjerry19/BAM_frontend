name: Deploy Frontend to EC2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GIT_DEPLOY_KEY: ${{ secrets.GIT_DEPLOY_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GIT_DEPLOY_KEY
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/ubuntu/BAM_frontend

            sudo chown -R ubuntu:ubuntu /home/ubuntu/BAM_frontend
            git config --global --add safe.directory /home/ubuntu/BAM_frontend

            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            touch "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/known_hosts"
            ssh-keyscan -t ed25519,rsa github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

            # Prefer key already on EC2; optional secret GIT_DEPLOY_KEY as fallback.
            # EC2_SSH_KEY is only for Actions→server, not for git@github.com.
            if [ -n "${GIT_DEPLOY_KEY:-}" ]; then
              printf '%s\n' "$GIT_DEPLOY_KEY" > "$HOME/.ssh/github_deploy"
              chmod 600 "$HOME/.ssh/github_deploy"
            fi

            DEPLOY_KEY=""
            for candidate in \
              "$HOME/.ssh/github_deploy_frontend" \
              "$HOME/.ssh/github_deploy" \
              "$HOME/.ssh/id_ed25519" \
              "$HOME/.ssh/id_rsa"
            do
              if [ -f "$candidate" ]; then
                DEPLOY_KEY="$candidate"
                break
              fi
            done

            if [ -z "$DEPLOY_KEY" ]; then
              echo "ERROR: no GitHub deploy key found under ~/.ssh/"
              echo "Expected ~/.ssh/github_deploy_frontend (or set secret GIT_DEPLOY_KEY)"
              exit 1
            fi

            chmod 600 "$DEPLOY_KEY"
            export GIT_SSH_COMMAND="ssh -i $DEPLOY_KEY -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
            echo "==> Using deploy key: $DEPLOY_KEY"

            echo "==> Pull latest"
            git remote -v
            git fetch origin
            DEFAULT_BRANCH="$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')"
            git checkout "$DEFAULT_BRANCH"
            git reset --hard "origin/$DEFAULT_BRANCH"

            echo "==> Build & restart (HTTPS stack)"
            sudo docker compose up -d --build --remove-orphans

            echo "==> Prune dangling images"
            sudo docker image prune -f

            echo "==> Status"
            sudo docker compose ps
            curl -fsS -o /dev/null -w "site=%{http_code}\n" https://jbam.id.vn/ || true
            curl -fsS -o /dev/null -w "api=%{http_code}\n" https://jbam.id.vn/api || true
